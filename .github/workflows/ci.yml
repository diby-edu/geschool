name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # Pas d'input `version` : la version vient de `packageManager` dans
      # package.json. Declarer les deux fait echouer l'action.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verification des types
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests unitaires
        run: pnpm test

  rls:
    name: Isolation multi-tenant (RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    # S'execute UNIQUEMENT si le secret DATABASE_URL_TEST est configure.
    #
    # Ce secret doit pointer vers un projet Supabase DEDIE AUX TESTS, jamais
    # vers la production : la suite y cree puis supprime des etablissements,
    # des comptes et des donnees de test (prefixe `rlstest-`).
    #
    # Sans secret, le job se termine proprement sans rien tester. C'est
    # volontaire : un job rouge en permanence finit desactive, et c'est
    # exactement le garde-fou de l'isolation qui disparaitrait avec lui.
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}

    steps:
      - name: Base de test configuree ?
        id: check
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::DATABASE_URL_TEST absent — suite RLS non executee."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.enabled == 'true'

      - name: Migrations sur la base de test
        if: steps.check.outputs.enabled == 'true'
        run: pnpm db:migrate

      - name: Suite d'isolation
        if: steps.check.outputs.enabled == 'true'
        run: pnpm test:rls

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    # Le build tourne ICI et jamais sur le VPS : `next build` saturerait
    # l'unique vCPU plusieurs minutes et ralentirait les huit sites en
    # production (ADR-014).
    steps:
      - uses: actions/checkout@v4

      # Pas d'input `version` : la version vient de `packageManager` dans
      # package.json. Declarer les deux fait echouer l'action.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Valeurs factices : le build ne contacte jamais la base, mais la
          # validation Zod des variables publiques doit passer.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
          NEXT_PUBLIC_APP_URL: https://geschool.numerik360.com
          NEXT_PUBLIC_PLATFORM_NAME: Gestion Scolaire

      - name: Assemblage de l'artefact standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ github.sha }}
          path: .next/standalone
          retention-days: 7
